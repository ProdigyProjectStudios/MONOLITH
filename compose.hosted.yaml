# Production overlay. The staging overlay inherits the same service definitions.
x-logging: &bounded_logs
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
x-app: &app
  image: ${MONOLITH_APP_IMAGE:-monolith-api:local}
  init: true
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: ["/tmp:size=192m,mode=1777"]
  logging: *bounded_logs
  pids_limit: 200
  stop_grace_period: 45s
services:
  db:
    image: ${MONOLITH_DB_IMAGE:-monolith-database:local}
    build: {context: ., dockerfile: deploy/database.Dockerfile}
    restart: unless-stopped
    mem_limit: ${MONOLITH_DB_MEMORY:-768m}
    cpus: ${MONOLITH_DB_CPUS:-1.5}
    pids_limit: 180
    shm_size: 128m
    logging: *bounded_logs
  redis:
    image: ${MONOLITH_REDIS_IMAGE:-redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe}
    restart: unless-stopped
    mem_limit: ${MONOLITH_REDIS_MEMORY:-384m}
    cpus: ${MONOLITH_REDIS_CPUS:-0.5}
    pids_limit: 64
    command: ["redis-server","--appendonly","yes","--appendfsync","everysec","--maxmemory","192mb","--maxmemory-policy","noeviction"]
    volumes: [monolith_queue:/data]
    logging: *bounded_logs
  api:
    <<: *app
    mem_limit: ${MONOLITH_API_MEMORY:-1g}
    cpus: ${MONOLITH_API_CPUS:-2}
    environment:
      MONOLITH_ENV: production
      MONOLITH_SEED_DEMO: ${MONOLITH_SEED_DEMO:-1}
      TENANT_IDENTITIES: ${TENANT_IDENTITIES:-}
      TENANT_TOKENS: ${TENANT_TOKENS:-}
      WEB_ORIGINS: ${WEB_ORIGINS:?Set the exact frontend origin}
      MONOLITH_RATE_LIMIT_PER_MINUTE: ${MONOLITH_RATE_LIMIT_PER_MINUTE:-180}
      MONOLITH_AUDIT_RETENTION_DAYS: ${MONOLITH_AUDIT_RETENTION_DAYS:-90}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
    ports: !reset []
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready',timeout=4).close()"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 40s
  worker:
    <<: *app
    mem_limit: ${MONOLITH_WORKER_MEMORY:-1g}
    cpus: ${MONOLITH_WORKER_CPUS:-2}
    stop_grace_period: 90s
    environment:
      MONOLITH_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
    healthcheck:
      test: ["CMD","python","-m","monolith.worker_probe"]
      interval: 12s
      timeout: 6s
      retries: 5
      start_period: 30s
  gateway:
    image: ${MONOLITH_GATEWAY_IMAGE:-monolith-gateway:local}
    build: {context: ., dockerfile: deploy/gateway.Dockerfile}
    restart: unless-stopped
    environment:
      MONOLITH_API_HOST: ${MONOLITH_API_HOST:?Set the hostname for the gateway}
      NO_PROXY: "api,localhost,127.0.0.1"
    ports:
      - "${MONOLITH_HTTP_PORT:-80}:80"
      - "${MONOLITH_HTTPS_PORT:-443}:443"
    volumes: [monolith_tls:/data, monolith_gateway:/config]
    mem_limit: ${MONOLITH_GATEWAY_MEMORY:-192m}
    cpus: ${MONOLITH_GATEWAY_CPUS:-0.75}
    pids_limit: 80
    logging: *bounded_logs
    healthcheck:
      test: ["CMD","wget","-Y","off","-q","-T","3","-O","/dev/null","http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on: {api: {condition: service_healthy}}
volumes:
  monolith_queue:
  monolith_tls:
  monolith_gateway:
