# Mount a host/secret-manager file into only the API and worker.
services:
  api:
    entrypoint: ["python", "-m", "monolith.provider_entrypoint"]
    command: ["uvicorn","monolith.main:app","--host","0.0.0.0","--port","8000"]
    environment:
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets: [openai_api_key]
  worker:
    entrypoint: ["python", "-m", "monolith.provider_entrypoint"]
    environment:
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets: [openai_api_key]
secrets:
  openai_api_key:
    file: ${MONOLITH_OPENAI_SECRET_PATH:?Set an absolute path to the provider key file}
